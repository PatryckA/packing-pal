<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packing Pal</title>
<meta name="description" content="A shared packing list for your household — trips, people, and gear, organized your way.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#146B69">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packing Pal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#EFE7D3; --ink:#1B2B2A; --ink-soft:#5C6B62; --surface:#FBF7EC;
  --surface-2:#F5EEDC; --line:#DCD0AF; --accent:#146B69; --accent-strong:#0E4F4E;
  --accent-contrast:#FBF7EC; --accent-bg:#DCEAE7; --done:#3F7D53; --done-bg:#DFEBE1;
  --critical:#B23A2E; --shadow:rgba(27,43,42,0.10);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141C1A; --ink:#EAE3D2; --ink-soft:#A8B0A6; --surface:#1B2523;
    --surface-2:#212C29; --line:#2C3835; --accent:#4FC3B8; --accent-strong:#7BD8CE;
    --accent-contrast:#0B1615; --accent-bg:#1E332F; --done:#6FBF8B; --done-bg:#1E3226;
    --critical:#E2726A; --shadow:rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --paper:#141C1A; --ink:#EAE3D2; --ink-soft:#A8B0A6; --surface:#1B2523;
  --surface-2:#212C29; --line:#2C3835; --accent:#4FC3B8; --accent-strong:#7BD8CE;
  --accent-contrast:#0B1615; --accent-bg:#1E332F; --done:#6FBF8B; --done-bg:#1E3226;
  --critical:#E2726A; --shadow:rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
button{font-family:var(--font-body);}
input,select{font-family:var(--font-body); font-size:1rem;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.app-shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:0.85rem 1rem;
  display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
}
.brand{display:flex; align-items:baseline; gap:0.4rem;}
.brand-mark{font-family:var(--font-display); font-size:1.35rem; font-weight:700; letter-spacing:-0.01em;}
.brand-tag{font-size:0.68rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; display:none;}
.topnav{display:flex; gap:0.4rem;}
.navbtn{
  background:none; border:1px solid var(--line); color:var(--ink); padding:0.4rem 0.7rem;
  border-radius:7px; font-size:0.82rem; font-weight:600; cursor:pointer;
}
.navbtn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.navbtn:hover{border-color:var(--accent);}
main{flex:1; padding:1rem 1rem 4rem;}
.offline-banner{
  background:var(--critical); color:#fff; font-size:0.82rem; font-weight:600;
  padding:0.6rem 1rem; text-align:center;
}
.sync-note{font-size:0.72rem; color:var(--ink-soft); text-align:center; padding:0.3rem 1rem 0;}
.loading-state{color:var(--ink-soft); font-size:0.9rem; padding:3rem 1rem; text-align:center;}

/* ---- Trips view ---- */
.section-title{font-size:1.5rem; margin-bottom:0.9rem;}
.trip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0.75rem;}
.trip-card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:1rem 0.9rem 0.9rem; cursor:pointer; text-align:left; color:var(--ink);
  display:flex; flex-direction:column; gap:0.55rem; min-height:118px;
}
.trip-card::before{
  content:""; position:absolute; top:-6px; left:16px; width:12px; height:12px;
  border-radius:50%; background:var(--paper); border:1px solid var(--line);
}
.trip-card .tname{font-family:var(--font-display); font-weight:600; font-size:1.05rem; text-wrap:balance;}
.trip-card .tdate{font-size:0.72rem; color:var(--ink-soft);}
.trip-card .tprog{margin-top:auto;}
.trip-card:hover{border-color:var(--accent);}
.new-trip-card{
  background:transparent; border:1.5px dashed var(--line); border-radius:10px; min-height:118px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  font-weight:700; font-size:0.85rem;
}
.new-trip-card:hover{border-color:var(--accent); color:var(--accent);}
.new-trip-form{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1rem;
  display:flex; flex-direction:column; gap:0.6rem; grid-column:1 / -1;
}
.empty-state{color:var(--ink-soft); font-size:0.9rem; padding:1.5rem 0.5rem; text-align:center;}
.trip-delete-row{display:flex; justify-content:flex-end; margin-top:0.4rem;}

/* ---- Progress ---- */
.progress-bar{height:8px; background:var(--line); border-radius:5px; overflow:hidden;}
.progress-fill{height:100%; background:var(--done); border-radius:5px; transition:width 200ms ease;}
.progress-label{font-size:0.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; margin-top:0.3rem;}

/* ---- Pack view ---- */
.pack-header{margin-bottom:0.9rem;}
.back-link{
  background:none; border:none; color:var(--ink-soft); font-size:0.78rem; font-weight:600;
  padding:0; cursor:pointer; margin-bottom:0.35rem;
}
.back-link:hover{color:var(--accent);}
.pack-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:0.6rem;}
.trip-title{font-size:1.55rem;}
.trip-created{font-size:0.72rem; color:var(--ink-soft); margin-top:0.15rem;}
.filter-row{display:flex; gap:0.4rem; margin:0.9rem 0 0.7rem; flex-wrap:wrap;}
.chip-filter{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:20px;
  padding:0.32rem 0.75rem; font-size:0.8rem; font-weight:700; cursor:pointer;
}
.chip-filter.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
.overall-progress{margin-bottom:1.1rem;}

.category-card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:0.75rem;
  overflow:hidden;
}
.category-head{
  display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
  padding:0.7rem 0.9rem; cursor:pointer; background:var(--surface-2);
}
.category-head h3{font-size:0.98rem; letter-spacing:0.01em;}
.category-count{font-size:0.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}
.chev{transition:transform 150ms ease; color:var(--ink-soft); flex:none;}
.chev.collapsed{transform:rotate(-90deg);}
.item-list{list-style:none; margin:0; padding:0;}
.item-list.collapsed{display:none;}
.item-row{
  display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
  padding:0.6rem 0.9rem; border-top:1px solid var(--line);
}
.item-name{font-size:0.92rem;}
.chip-row{display:flex; gap:0.35rem; flex:none;}
.pchip{
  width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:0.68rem; font-weight:800;
  cursor:pointer; color:var(--ink-soft); flex:none; padding:0;
}
.pchip.on{color:#fff;}
.item-row.done .item-name{color:var(--ink-soft); text-decoration:line-through;}

.solo-row{
  display:flex; align-items:center; gap:0.65rem; padding:0.65rem 0.9rem; border-top:1px solid var(--line);
  cursor:pointer; background:none; border-left:none; border-right:none; border-bottom:none; width:100%;
  text-align:left; color:var(--ink); font-size:0.92rem;
}
.solo-box{
  width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line); flex:none;
  display:flex; align-items:center; justify-content:center; background:var(--surface);
}
.solo-row.done .solo-box{background:var(--done); border-color:var(--done);}
.solo-row.done .item-name{color:var(--ink-soft); text-decoration:line-through;}
.check-mark{color:#fff; font-size:0.8rem; line-height:1;}

.bwl-card{border-color:var(--critical);}
.bwl-card .category-head{background:var(--surface-2);}
.bwl-label{
  font-size:0.66rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--critical);
  font-weight:800; margin-bottom:0.2rem; display:block;
}

/* ---- Manage view ---- */
.manage-tabs{display:flex; gap:0.4rem; overflow-x:auto; padding-bottom:0.6rem; margin-bottom:0.9rem; scrollbar-width:thin;}
.mtab{
  flex:none; background:var(--surface); border:1px solid var(--line); color:var(--ink);
  padding:0.4rem 0.75rem; border-radius:20px; font-size:0.8rem; font-weight:700; cursor:pointer;
  white-space:nowrap;
}
.mtab.active{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
.mtab.bwl-tab{border-color:var(--critical); color:var(--critical);}
.mtab.bwl-tab.active{background:var(--critical); color:#fff;}
.manage-head{display:flex; align-items:center; gap:0.5rem; margin-bottom:0.9rem;}
.cat-name-input{
  font-family:var(--font-display); font-size:1.3rem; font-weight:600; background:none; border:none;
  border-bottom:2px solid transparent; color:var(--ink); flex:1; padding:0.1rem 0;
}
.cat-name-input:hover,.cat-name-input:focus{border-bottom-color:var(--line);}
.iconbtn{
  background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); border-radius:7px;
  width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.iconbtn:hover{border-color:var(--critical); color:var(--critical);}
.iconbtn.armed{background:var(--critical); color:#fff; border-color:var(--critical); font-size:0.68rem; width:auto; padding:0 0.5rem;}
.iconbtn.editing{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
.manage-row{
  display:flex; align-items:center; gap:0.55rem; padding:0.55rem 0; border-top:1px solid var(--line);
}
.manage-row:first-of-type{border-top:none;}
.manage-name-input{
  flex:1; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:0.45rem 0.6rem;
  color:var(--ink); font-size:0.9rem; min-width:0;
}
.manage-name-input:focus{border-color:var(--accent);}
.add-row-form{
  display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem; margin-top:0.9rem; padding-top:0.9rem;
  border-top:1px dashed var(--line);
}
.add-row-form input[type="text"]{
  flex:1; min-width:140px; background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:0.5rem 0.65rem; color:var(--ink);
}
.who-toggle{display:flex; gap:0.3rem;}
.btn{
  background:var(--accent); color:var(--accent-contrast); border:none; border-radius:7px;
  padding:0.5rem 0.9rem; font-weight:700; font-size:0.85rem; cursor:pointer;
}
.btn:hover{background:var(--accent-strong);}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--line);}
.add-cat-form{display:flex; gap:0.4rem; align-items:center; flex:none;}
.add-cat-form input{
  background:var(--surface); border:1px dashed var(--line); border-radius:20px; padding:0.35rem 0.7rem;
  font-size:0.8rem; color:var(--ink); width:9rem;
}
.manage-row.has-location{flex-wrap:wrap;}
.location-row{flex:1 0 100%; display:flex; align-items:center; gap:0.4rem; font-size:0.78rem; color:var(--ink-soft); margin-top:0.35rem;}
.location-row.tag-row{align-items:flex-start;}
.location-select{
  flex:1; max-width:200px; background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:0.3rem 0.5rem; color:var(--ink); font-size:0.85rem;
}
.tag-chip-row{display:flex; flex-wrap:wrap; gap:0.3rem;}
.tag-chip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:20px;
  padding:0.22rem 0.65rem; font-size:0.72rem; font-weight:700; cursor:pointer; flex:none;
}
.tag-chip.on{background:var(--accent-bg); border-color:var(--accent); color:var(--accent-strong);}
.manage-empty{color:var(--ink-soft); font-size:0.85rem; padding:0.8rem 0;}
.people-legend{display:flex; gap:1rem; flex-wrap:wrap; font-size:0.72rem; color:var(--ink-soft); margin-bottom:1rem;}
.people-legend span{display:inline-flex; align-items:center; gap:0.3rem;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
::-webkit-scrollbar{height:6px;}

/* ---- Sign-in / onboarding / household ---- */
.authscreen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:2rem 1.25rem; gap:1.1rem;
}
.authscreen .brand-mark{font-family:var(--font-display); font-size:2rem; font-weight:700;}
.authscreen p{color:var(--ink-soft); font-size:0.92rem; max-width:26rem; margin:0;}
.gbtn{
  display:inline-flex; align-items:center; gap:0.6rem; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:0.65rem 1.2rem; font-weight:700;
  font-size:0.92rem; cursor:pointer;
}
.gbtn:hover{border-color:var(--accent);}
.onboard-card{
  max-width:420px; margin:2rem auto; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:1.25rem; display:flex; flex-direction:column; gap:0.75rem;
}
.onboard-card h2{font-size:1.2rem;}
.onboard-card input[type="text"]{
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:0.55rem 0.7rem;
  color:var(--ink); font-size:0.95rem;
}
.onboard-choice{display:flex; flex-direction:column; gap:0.6rem;}
.invite-box{
  display:flex; align-items:center; gap:0.5rem; background:var(--surface-2); border:1px dashed var(--line);
  border-radius:7px; padding:0.6rem 0.7rem; font-size:0.82rem; color:var(--ink-soft); word-break:break-all;
}
.member-row{display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0; border-top:1px solid var(--line); font-size:0.88rem;}
.member-row:first-of-type{border-top:none;}
</style>
</head>
<body>
<div id="app"><div class="loading-state">Loading Packing Pal…</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  collection, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult,
  GoogleAuthProvider, signOut as firebaseSignOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

/* ---------------------------------------------------------------------
   Firebase — this project's data lives in Cloud Firestore, synced live
   to every device with this page open. No publish limits, no "shared
   version" to fall behind, and edits below write to a single field or
   document at a time so two people changing different things can never
   clobber each other.

   Every household's data lives under households/{householdId} — see the
   "Households" section below for how a signed-in user gets there.
--------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDZV7aDhVJNXLVdxtlUrDwZasaO1lC5HAM",
  authDomain: "packing-pal-6e96b.firebaseapp.com",
  projectId: "packing-pal-6e96b",
  storageBucket: "packing-pal-6e96b.firebasestorage.app",
  messagingSenderId: "546025854309",
  appId: "1:546025854309:web:bd07ec84af0b27426c3d8c"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

/* ---------------------------------------------------------------------
   PEOPLE — who items get assigned to. Fully household-defined: a brand
   new household starts with nobody, and adds its own people from the
   onboarding step or the Manage screen's People tab. Not the same thing
   as an account (see Households below) — a household can have people
   who don't sign in at all (e.g. kids), and an account holder doesn't
   have to be one of the assignable "people".
--------------------------------------------------------------------- */
function getPeople(){ return (STATE.master && STATE.master.people) || []; }
function personName(id){ const p = getPeople().find(p=>p.id===id); return p ? p.name : id; }

// Colour palette for person chips/dots, assigned by each person's
// position — household people first, then (on a trip) anyone added just
// for that trip. Plain inline styles rather than CSS classes since a
// household's people are arbitrary, not a fixed known set.
const PERSON_COLORS = ['#2B5F8A','#8C3E63','#B5701F','#3E7D5A','#6B5B95','#A85751','#3E6B8A','#8A6D3E'];
function personColorIndex(trip, personId){
  const idx = getPeople().findIndex(p => p.id === personId);
  if (idx !== -1) return idx;
  const extra = (trip && trip.extraPeople) || [];
  const eIdx = extra.findIndex(p => p.id === personId);
  if (eIdx !== -1) return getPeople().length + eIdx;
  return 0;
}
function personChipAttrs(trip, personId, on){
  const c = PERSON_COLORS[personColorIndex(trip, personId) % PERSON_COLORS.length];
  const style = on ? ('background:' + c + ';border-color:' + c + ';color:#fff;') : ('border-color:' + c + ';color:' + c + ';');
  return { cls: '', style: style };
}
// The base household people actually on this trip come from trip.people,
// chosen in the "Who's travelling?" survey. Trips created before that
// field existed have no trip.people, so fall back to everyone.
function tripPeople(trip){
  const base = (trip && Array.isArray(trip.people))
    ? getPeople().filter(p => trip.people.includes(p.id))
    : getPeople();
  return base.concat((trip && trip.extraPeople) || []);
}
function personNameInTrip(trip, id){
  const base = getPeople().find(p => p.id === id);
  if (base) return base.name;
  const extra = ((trip && trip.extraPeople) || []).find(p => p.id === id);
  return extra ? extra.name : id;
}
// Pre-checked "who" chips for an add-item/add-reminder form — plain
// label+checkbox pairs, not yet part of STATE, so the on/off look has to
// travel with the markup itself (via data-on-style/data-off-style) for
// the change handler to swap between when someone unticks a person.
function whoCheckboxChips(trip){
  let html = '';
  tripPeople(trip).forEach(p => {
    const onStyle = personChipAttrs(trip, p.id, true).style;
    const offStyle = personChipAttrs(trip, p.id, false).style;
    html += '<label class="pchip on" style="' + onStyle + 'cursor:pointer;" data-on-style="' + escapeHtml(onStyle) + '" data-off-style="' + escapeHtml(offStyle) + '">' +
      '<input type="checkbox" name="who" value="' + p.id + '" checked style="display:none;"><span class="pchip-letter">' + escapeHtml(p.name.charAt(0)) + '</span></label>';
  });
  return html;
}

/* ---------------------------------------------------------------------
   LOCATIONS — where an item is kept in the house. Used by the Manage
   list screen (per-item dropdown) and the Pack screen's "by location"
   sort. Unlike PEOPLE, an item has at most one location. Stored on the
   master list itself (STATE.master.locations) so new locations can be
   added from the Manage screen and everyone sees them; this fallback
   list is only used until that field exists.
--------------------------------------------------------------------- */
const DEFAULT_LOCATIONS = [
  {id:'bedroom', name:'Bedroom'},
  {id:'bathroom', name:'Bathroom'},
  {id:'linen', name:'Linen closet'},
  {id:'office', name:'Office'},
  {id:'downstairs', name:'Downstairs'},
  {id:'garage', name:'Garage'},
  {id:'car', name:'Car'}
];
function getLocations(){
  return (STATE.master.locations && STATE.master.locations.length) ? STATE.master.locations : DEFAULT_LOCATIONS;
}
function locationName(id){ const l = getLocations().find(l=>l.id===id); return l ? l.name : 'Unsorted'; }

/* ---------------------------------------------------------------------
   CONDITIONS — the quick yes/no questions asked when creating a trip.
   An item can be tagged with any number of these — it appears on a trip
   if AT LEAST ONE of its tags was answered yes (e.g. a suit tagged both
   "work" and "formal" shows up for either kind of trip). An untagged
   item always appears.
--------------------------------------------------------------------- */
const CONDITIONS = [
  {id:'swimming', name:'Will there be swimming?', short:'Swimming'},
  {id:'dance', name:'Will there be a dance event?', short:'Dance event'},
  {id:'international', name:'Is it international travel?', short:'International'},
  {id:'cold', name:'Will it be very cold?', short:'Very cold'},
  {id:'work', name:'Is it a work trip?', short:'Work trip'},
  {id:'formal', name:'Is there a formal occasion?', short:'Formal'},
  {id:'roadtrip', name:'Is it a road trip?', short:'Road trip'}
];
function conditionName(id){ const c = CONDITIONS.find(c=>c.id===id); return c ? c.name : id; }

/* ---------------------------------------------------------------------
   STARTER TEMPLATE — a generic, nobody-in-particular packing list a
   brand new household can optionally load instead of starting from a

function addStarterTemplate(){
  const who = getPeople().map(p => p.id);
  const buildItem = (entry, catLocation) => {
    const [name, tags, location] = Array.isArray(entry) ? entry : [entry, []];
    return { id: uid('item'), name, who: who.slice(), location: location || catLocation || '', tags: (tags || []).slice() };
  };
  STARTER_TEMPLATE.categories.forEach(cat => {
    STATE.master.categories.push({
      id: uid('cat'), name: cat.name,
      items: cat.items.map(entry => buildItem(entry, cat.location))
    });
  });
  STARTER_TEMPLATE.beforeWeLeave.forEach(name => {
    STATE.master.beforeWeLeave.push({ id: uid('bwl'), name, who: who.slice() });
  });
  scheduleMasterSave();

// Items may still carry the old single `tag` string (from before tags
// became multi-select) — this normalizes either shape to an array so
// every reader can just treat item.tags as a list.
function itemTags(item){
  if (Array.isArray(item.tags)) return item.tags;
  return item.tag ? [item.tag] : [];
}

// Failures here used to vanish silently (console.warn only) — someone
// clicking "Continue with Google" with popups blocked, or before the
// site is on Firebase's authorized-domains list, saw literally nothing
// happen. Now: known popup problems retry as a full-page redirect, and
// anything else shows an actual message on the sign-in screen.
function authErrorMessage(err){
  const code = err && err.code;
  if (code === 'auth/unauthorized-domain') return "This site isn't yet authorized for sign-in — add it under Firebase Console → Authentication → Settings → Authorized domains.";
  if (code === 'auth/popup-blocked') return 'Your browser blocked the sign-in popup. Allow popups for this site and try again.';
  if (code === 'auth/network-request-failed') return 'Network error — check your connection and try again.';
  if (code === 'auth/cancelled-popup-request' || code === 'auth/popup-closed-by-user') return '';
  return 'Sign-in failed' + (code ? ' (' + code + ')' : '') + ' — try again in a moment.';
}
function signIn(){
  UI.authError = '';
  signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
    console.warn('Packing Pal: popup sign-in failed', err);
    const code = err && err.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment'){
      // Popup didn't work (common on mobile browsers, or with popups
      // blocked outright) — fall back to a full-page redirect instead.
      signInWithRedirect(auth, new GoogleAuthProvider()).catch(err2 => {
        console.warn('Packing Pal: redirect sign-in failed', err2);
        UI.authError = authErrorMessage(err2);
        render();
      });
      return;
    }
    UI.authError = authErrorMessage(err);
    render();
  });
}
function signOutUser(){
  firebaseSignOut(auth).catch(err => console.warn('Packing Pal: sign-out failed', err));
}
let unsubMaster = null, unsubTrips = null, listenersHouseholdId = null;
function stopHouseholdListeners(){
  if (unsubMaster) unsubMaster();
  if (unsubTrips) unsubTrips();
  unsubMaster = null; unsubTrips = null; listenersHouseholdId = null;
  masterLoaded = false; tripsLoaded = false;
}
function startHouseholdListeners(householdId){
  if (listenersHouseholdId === householdId) return;
  stopHouseholdListeners();
  listenersHouseholdId = householdId;
  unsubMaster = onSnapshot(doc(db, 'households', householdId, 'state', 'master'),
    (snap) => {
      STATE.master = snap.exists() ? snap.data() : { categories: [], beforeWeLeave: [], people: [] };
      const wasLoaded = masterLoaded;
      masterLoaded = true;
      if (!wasLoaded || UI.view === 'manage') render();
    },
    (err) => { console.warn('Packing Pal: master listener error', err); }
  );
  unsubTrips = onSnapshot(collection(db, 'households', householdId, 'trips'),
    (snap) => {
      const trips = snap.docs.map(d => d.data());
      trips.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
      STATE.trips = trips;
      const wasLoaded = tripsLoaded;
      tripsLoaded = true;
      if (!wasLoaded || UI.view === 'trips' || UI.view === 'pack') render();
    },
    (err) => { console.warn('Packing Pal: trips listener error', err); }
  );
}

// Looks up (once per sign-in) which household this account belongs to.
// If it has none and we arrived via an invite link, resolves that
// link's household name for the join-confirmation prompt instead.
async function resolveHousehold(){
  HOUSEHOLD = { id: null, name: '', resolved: false, members: [], membersLoaded: false };
  render();
  try {
    const userSnap = await getDoc(doc(db, 'users', AUTH.user.uid));
    const householdId = userSnap.exists() ? userSnap.data().householdId : null;
    if (householdId){
      const hhSnap = await getDoc(doc(db, 'households', householdId));
      HOUSEHOLD.id = householdId;
      HOUSEHOLD.name = hhSnap.exists() ? (hhSnap.data().name || '') : '';
      HOUSEHOLD.resolved = true;
      startHouseholdListeners(householdId);
      render();
      return;
    }
    if (pendingJoinId){
      const inviteSnap = await getDoc(doc(db, 'households', pendingJoinId));
      if (inviteSnap.exists()){
        UI.onboardInviteName = inviteSnap.data().name || 'a household';
      } else {
        UI.onboardInviteError = "That invite link doesn't look valid anymore.";
        pendingJoinId = null;
      }
    }
    HOUSEHOLD.resolved = true;
    render();
  } catch(err){
    console.warn('Packing Pal: household lookup failed', err);
    UI.onboardInviteError = 'Something went wrong loading your account — try refreshing.';
    HOUSEHOLD.resolved = true;
    render();
  }
}
async function createHousehold(name){
  if (!AUTH.user) return;
  UI.onboardInviteError = '';
  UI.creatingHousehold = true;
  render();
  const householdName = name.trim() || 'Our household';
  try {
    const householdRef = doc(collection(db, 'households'));
    // Two separate writes, not one batch: households/{id}/state/master's
    // rule requires this account to already be a member, and Firestore
    // evaluates each write in a batch against the database as it stood
    // BEFORE the batch — it doesn't let one queued write's rules see
    // another queued write in the same batch. Bundling the membership
    // doc and the master doc into a single batch means the master
    // write's isMember() check always sees "not a member yet" and gets
    // rejected, silently failing the whole batch. Committing membership
    // first, then writing the rest once it's actually in the database,
    // avoids that.
    const setupBatch = writeBatch(db);
    setupBatch.set(householdRef, {
      name: householdName, ownerUid: AUTH.user.uid, createdAt: new Date().toISOString()
    });
    setupBatch.set(doc(db, 'households', householdRef.id, 'members', AUTH.user.uid), {
      name: AUTH.user.displayName || AUTH.user.email || 'Someone', email: AUTH.user.email || '', joinedAt: new Date().toISOString()
    });
    await setupBatch.commit();
    const dataBatch = writeBatch(db);
    dataBatch.set(doc(db, 'households', householdRef.id, 'state', 'master'), { categories: [], beforeWeLeave: [], people: [] });
    dataBatch.set(doc(db, 'users', AUTH.user.uid), { householdId: householdRef.id });
    await dataBatch.commit();
    HOUSEHOLD.id = householdRef.id;
    HOUSEHOLD.name = householdName;
    HOUSEHOLD.resolved = true;
    startHouseholdListeners(householdRef.id);
  } catch(err){
    console.warn('Packing Pal: create household failed', err);
    UI.onboardInviteError = 'Could not create your household — try again in a moment.';
  }
  UI.creatingHousehold = false;
  render();
}
async function joinHousehold(householdId){
  if (!AUTH.user) return;

  UI.joiningHousehold = true;

  try {
    const batch = writeBatch(db);

// One-time import of this Firebase project's pre-account data (the
// original single shared household) into a brand new household. Only
// meaningful for whoever's reclaiming that old data; harmless no-op
// (empty categories) for anyone else since it just copies what's there.
async function migrateLegacyData(){
  if (!HOUSEHOLD.id) return;
  UI.migrating = true; render();
  try {
    const legacyMasterSnap = await getDoc(doc(db, 'state', 'master'));
    const legacyTripsSnap = await getDocs(collection(db, 'trips'));
    const batch = writeBatch(db);
    if (legacyMasterSnap.exists()){
      const legacyMaster = legacyMasterSnap.data();
      // The legacy list predates named people entirely — its who[]
      // arrays reference the ids 'pat'/'wendy'/'maddy' directly, so
      // seeding those same ids as people keeps every assignment working;

      legacyMaster.people = [
        {id:'pat', name:'Pat'}, {id:'wendy', name:'Wendy'}, {id:'maddy', name:'Maddy'}
      ];
      batch.set(doc(db, 'households', HOUSEHOLD.id, 'state', 'master'), legacyMaster);
    }
    legacyTripsSnap.docs.forEach(d => {

    });

    UI.onboardInviteError = 'Import failed — try again in a moment.';

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function findTrip(id){ return STATE.trips.find(t => t.id === id); }
function findCategory(id){ return STATE.master.categories.find(c => c.id === id); }
function computeProgress(items, packed, filterPerson){
  let total = 0, done = 0;
  items.forEach(it => {
    const who = filterPerson === 'all' ? it.who : it.who.filter(p => p === filterPerson);
    who.forEach(p => { total++; if (packed[it.id] && packed[it.id][p]) done++; });
  });
  return {total, done};
}
function fmtDate(iso){
  try { return new Date(iso).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); }
  catch(e){ return ''; }
}

/* ---------------------------------------------------------------------
   Mutations — each updates local STATE for instant feedback, then
   writes only the relevant Firestore document/field so unrelated data
   (other trips, other people's ticks) is never touched by this write.
--------------------------------------------------------------------- */
function createTrip(name, conditions, people, guestNames){
  const conds = conditions || [];
  // Who's travelling — the base people ticked in the survey, kept in
  // canonical order, plus any typed-in guests. If nobody at all was
  // picked, assume the whole household rather than make an empty trip.
  let peopleIds = getPeople().map(p => p.id).filter(id => (people || []).includes(id));
  const extraPeople = (guestNames || [])
    .map(n => String(n || '').trim())
    .filter(Boolean)
    .map(n => ({ id: uid('person'), name: n }));
  if (peopleIds.length === 0 && extraPeople.length === 0){
    peopleIds = getPeople().map(p => p.id);
  }
  const travelling = peopleIds.concat(extraPeople.map(p => p.id));
  // An item with no tags always comes along; a tagged item comes along
  // if ANY of its tags was answered yes on the survey.
  const keep = (item) => {
    const tags = itemTags(item);
    return tags.length === 0 || tags.some(t => conds.includes(t));
  };
  // Strip any assignment to someone not on this trip, so packed counts
  // and chips only ever show people who are actually coming. They can
  // still be added back later with "+ Person".
  const trimWho = (item) => {
    item.who = (item.who || []).filter(p => travelling.includes(p));
    return item;
  };
  const categories = JSON.parse(JSON.stringify(STATE.master.categories))
    .map(cat => ({ ...cat, items: cat.items.filter(keep).map(trimWho) }));
  const beforeWeLeave = JSON.parse(JSON.stringify(STATE.master.beforeWeLeave)).filter(keep).map(trimWho);
  const trip = {
    id: uid('trip'),
    name: name.trim() || 'New trip',
    createdAt: new Date().toISOString(),
    people: peopleIds,
    categories, beforeWeLeave,
    packed: {},
    extraPeople: extraPeople
  };
  STATE.trips.unshift(trip);
  UI.currentTripId = trip.id;
  UI.view = 'pack';
  UI.packFilter = 'all';
  UI.packSort = 'location';
  try { localStorage.setItem('packingpal-current-trip', trip.id); } catch(e){}
  setDoc(tripDoc(trip.id), trip).catch(handleSaveError);
}
// Adds someone to just this trip's roster (e.g. a grandparent joining one
// holiday) — the household's own people stay the permanent baseline
// everywhere else; this only ever affects the one trip.
function addTripPerson(tripId, name){
  const trip = findTrip(tripId);
  if (!trip || !name.trim()) return;
  if (!trip.extraPeople) trip.extraPeople = [];
  trip.extraPeople.push({ id: uid('person'), name: name.trim() });
  updateDoc(tripDoc(tripId), { extraPeople: trip.extraPeople }).catch(handleSaveError);
}
function removeTripPerson(tripId, personId){
  const trip = findTrip(tripId);
  if (!trip) return;
  trip.extraPeople = (trip.extraPeople || []).filter(p => p.id !== personId);
  // Drop any assignments to them too, so they don't linger as an
  // invisible assignee no one can see or clear.
  trip.categories.forEach(cat => cat.items.forEach(item => {
    const idx = item.who.indexOf(personId);
    if (idx !== -1) item.who.splice(idx, 1);
  }));
  trip.beforeWeLeave.forEach(item => {
    const idx = item.who.indexOf(personId);
    if (idx !== -1) item.who.splice(idx, 1);
  });
  updateDoc(tripDoc(tripId), { extraPeople: trip.extraPeople, categories: trip.categories, beforeWeLeave: trip.beforeWeLeave }).catch(handleSaveError);
}
function deleteTrip(id){
  STATE.trips = STATE.trips.filter(t => t.id !== id);
  if (UI.currentTripId === id){ UI.currentTripId = null; UI.view = 'trips'; }
  deleteDoc(tripDoc(id)).catch(handleSaveError);
}
function togglePacked(tripId, itemId, personId){
  const trip = findTrip(tripId);
  if (!trip) return;
  trip.packed[itemId] = trip.packed[itemId] || {};
  trip.packed[itemId][personId] = !trip.packed[itemId][personId];
  const fieldPath = 'packed.' + itemId + '.' + personId;
  updateDoc(tripDoc(tripId), { [fieldPath]: trip.packed[itemId][personId] }).catch(handleSaveError);
}
// Adds a reminder to THIS trip's own before-we-leave list only — it
// won't appear on other trips and won't change the master list, since
// this is for something specific you thought of while packing this trip.
function addTripBwl(tripId, name, who){
  const trip = findTrip(tripId);
  if (!trip || !name.trim()) return;
  trip.beforeWeLeave.push({id: uid('bwl'), name: name.trim(), who: who.length ? who : tripPeople(trip).map(p => p.id)});
  updateDoc(tripDoc(tripId), { beforeWeLeave: trip.beforeWeLeave }).catch(handleSaveError);
}
// Moves an item you're not ready to pack yet out of its category and
// into this trip's own Before We Leave list — just for this trip, not
// the master list. Keeps its name, who it's assigned to, and its packed
// state (packed is keyed by item id regardless of which list it's in).
function moveTripItemToBwl(tripId, itemId){
  const trip = findTrip(tripId);
  if (!trip) return;
  let found = null;
  trip.categories.forEach(cat => {
    const idx = cat.items.findIndex(i => i.id === itemId);
    if (idx !== -1){ found = cat.items[idx]; cat.items.splice(idx, 1); }
  });
  if (!found) return;
  trip.beforeWeLeave.push({ id: found.id, name: found.name, who: found.who });
  updateDoc(tripDoc(tripId), { categories: trip.categories, beforeWeLeave: trip.beforeWeLeave }).catch(handleSaveError);
}
// Reassigns who's packing this item for THIS trip only — the master
// list (and every other trip) is untouched. Useful when you decide,
// mid-packing, that someone else should handle a particular item.
function toggleTripItemAssignee(tripId, itemId, personId){
  const trip = findTrip(tripId);
  if (!trip) return;
  let item = null;
  trip.categories.forEach(cat => {
    const found = cat.items.find(i => i.id === itemId);
    if (found) item = found;
  });
  if (!item) return;
  const idx = item.who.indexOf(personId);
  if (idx === -1) item.who.push(personId); else item.who.splice(idx, 1);
  updateDoc(tripDoc(tripId), { categories: trip.categories }).catch(handleSaveError);
}
function addItem(catId, name, who, location, tags){
  const cat = findCategory(catId);
  if (!cat || !name.trim()) return;
  cat.items.push({
    id: uid('item'), name: name.trim(), who: who.length ? who : getPeople().map(p => p.id),
    location: location || 'bedroom', tags: tags || []
  });
  scheduleMasterSave();
}
function setItemLocation(catId, itemId, location){
  const cat = findCategory(catId);
  const item = cat && cat.items.find(i => i.id === itemId);
  if (!item) return;
  item.location = location;
  scheduleMasterSave();
}
function toggleItemTag(catId, itemId, tagId){
  const cat = findCategory(catId);
  const item = cat && cat.items.find(i => i.id === itemId);
  if (!item) return;
  const tags = itemTags(item);
  const idx = tags.indexOf(tagId);
  if (idx === -1) tags.push(tagId); else tags.splice(idx, 1);
  item.tags = tags;

}
// Adds a new location option, available immediately in every location

function addLocation(name){

function deleteItem(catId, itemId){

}
// Reclassifies a packable item as a before-we-leave reminder — removes

function moveItemToBwl(catId, itemId){

}
function toggleItemAssignee(catId, itemId, personId){

// Removes a person from the household roster and strips them from every

function deletePerson(personId){
  STATE.master.people = getPeople().filter(p => p.id !== personId);

    const idx = item.who.indexOf(personId);
    if (idx !== -1) item.who.splice(idx, 1);
  }));
  STATE.master.beforeWeLeave.forEach(item => {

}

function deleteCategory(catId){

function addBwl(name, who){

function deleteBwl(itemId){

/* ---------------------------------------------------------------------
   Saving the master list — batched with a short debounce so a burst of
   edits (typing a name, ticking several assignee chips) becomes one
   write, not one per keystroke/tap. Trips are never touched by this.
--------------------------------------------------------------------- */
let masterSaveTimer = null;
function scheduleMasterSave(){
  clearTimeout(masterSaveTimer);
  masterSaveTimer = setTimeout(() => {
    setDoc(masterDoc(), STATE.master).catch(handleSaveError);
  }, 800);
}
function flushMasterSaveNow(){
  clearTimeout(masterSaveTimer);
  setDoc(masterDoc(), STATE.master).catch(handleSaveError);
}
function handleSaveError(err){
  console.warn('Packing Pal: save failed', err);
}

// Shared renderer for one category-card section, used both for
// category-mode groups and location-mode groups — same filtering,
// sort-to-bottom-when-packed, and collapse behaviour either way.
function renderPackGroup(groupId, groupName, items, trip, filter){
  // Same reasoning as bwlItems above — "All" still hides items with an
  // empty who[] (nobody assigned, typically because everyone they were
  // assigned to got trimmed off this trip's roster).
  let visibleItems = filter === 'all' ? items.filter(i => i.who.length > 0) : items.filter(i => i.who.includes(filter));
  if (visibleItems.length === 0) return '';
  visibleItems = sortPackItems(visibleItems, trip, filter);
  const prog = computeProgress(visibleItems, trip.packed, filter);
  const collapsed = collapsedCats.has(groupId);
  let html = '<section class="category-card"><div class="category-head" data-action="toggle-collapse" data-cat="' + groupId + '">' +
    '<h3>' + escapeHtml(groupName) + '</h3>' +
    '<span style="display:flex;align-items:center;gap:0.5rem;"><span class="category-count">' + prog.done + '/' + prog.total + '</span>' +
    chevSvg(collapsed) + '</span></div>';
  html += '<ul class="item-list' + (collapsed?' collapsed':'') + '">';
  visibleItems.forEach(item => { html += renderPackRow(trip, item, filter); });
  html += '</ul></section>';
  return html;
}
function chevSvg(collapsed){
  return '<svg class="chev' + (collapsed?' collapsed':'') + '" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
/* Whether an item is FULLY packed — every person it's assigned to has
   ticked their own part (on a person filter, just that person). This
   drives the strikethrough "done" styling, which is deliberately an
   all-or-nothing state: a shared item still needs attention from whoever
   hasn't packed their share yet. */
function isItemPackDone(trip, item, filter){
  if (filter === 'all'){
    return item.who.length > 0 && item.who.every(p => trip.packed[item.id] && trip.packed[item.id][p]);
  }
  return !!(trip.packed[item.id] && trip.packed[item.id][filter]);
}
/* Sort score, separate from isItemPackDone above: on "All", a shared
   item's position reflects how much of it is packed (0 = nobody, 1 =
   everybody), not just all-or-nothing. That way an item you've personally
   packed sinks toward the bottom of your own view right away, instead of
   sitting at the top until every other assignee catches up too — each
   person's progress moves the shared list independently of anyone else's.
   On a person filter there's only one assignee to consider, so it's the
   same binary check as isItemPackDone. */
function packProgressScore(trip, item, filter){
  if (filter !== 'all') return isItemPackDone(trip, item, filter) ? 1 : 0;
  if (!item.who.length) return 0;
  const done = item.who.filter(p => trip.packed[item.id] && trip.packed[item.id][p]).length;
  return done / item.who.length;
}
function sortPackItems(items, trip, filter){
  return items
    .map((item, idx) => ({item, idx, score: packProgressScore(trip, item, filter)}))

/* ---------------------------------------------------------------------
   Event delegation
--------------------------------------------------------------------- */
function armDelete(key){
  armedDeletes.add(key);
  render();
  setTimeout(() => { armedDeletes.delete(key); render(); }, 3000);
}
function handleDelete(action, id){
  const key = action + ':' + id;
  if (!armedDeletes.has(key)){ armDelete(key); return; }
  armedDeletes.delete(key);
  if (action === 'delete-trip') deleteTrip(id);
  else if (action === 'delete-category') deleteCategory(id);
  else if (action === 'delete-item'){ const [catId,itemId] = id.split('::'); deleteItem(catId,itemId); }
  else if (action === 'delete-before') deleteBwl(id);
  else if (action === 'delete-person') deletePerson(id);
  render();
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'go-trips':
      if (UI.view === 'manage') flushMasterSaveNow();
      UI.view = 'trips'; saveUISnapshot(); render(); break;
    case 'go-manage': UI.view = 'manage'; saveUISnapshot(); render(); break;
    case 'show-new-trip': UI.addingTrip = true; render(); break;
    case 'hide-new-trip': UI.addingTrip = false; render(); break;
    case 'open-trip':
      if (UI.view === 'manage') flushMasterSaveNow();
      UI.currentTripId = el.dataset.trip; UI.view = 'pack'; UI.packFilter = 'all'; UI.packSort = 'location'; UI.addingTripPerson = false;
      try { localStorage.setItem('packingpal-current-trip', el.dataset.trip); } catch(err){}
      saveUISnapshot();
      render();
      break;
    case 'show-add-trip-person': UI.addingTripPerson = true; render(); break;
    case 'remove-trip-person':
      removeTripPerson(el.dataset.trip, el.dataset.person);
      render();
      break;
    case 'set-filter': UI.packFilter = el.dataset.person; saveUISnapshot(); render(); break;
    case 'set-packsort': UI.packSort = el.dataset.sort; saveUISnapshot(); render(); break;
    case 'toggle-collapse':
      { const c = el.dataset.cat; if (collapsedCats.has(c)) collapsedCats.delete(c); else collapsedCats.add(c); render(); }
      break;
    case 'toggle-chip':
      togglePacked(UI.currentTripId, el.dataset.item, el.dataset.person);
      render();
      break;
    case 'move-trip-item-to-bwl':
      moveTripItemToBwl(el.dataset.trip, el.dataset.item);
      render();
      break;
    case 'toggle-edit-assignees':
      { const id = el.dataset.item; if (editingAssignees.has(id)) editingAssignees.delete(id); else editingAssignees.add(id); render(); }
      break;
    case 'toggle-trip-item-assignee':
      toggleTripItemAssignee(el.dataset.trip, el.dataset.item, el.dataset.person);
      render();
      break;
    case 'manage-tab': UI.manageTab = el.dataset.cat; saveUISnapshot(); render(); break;
    case 'toggle-item-assignee':
      toggleItemAssignee(el.dataset.cat, el.dataset.item, el.dataset.person);
      render();
      break;
    case 'toggle-item-tag':
      toggleItemTag(el.dataset.cat, el.dataset.item, el.dataset.tag);
      render();
      break;
    case 'toggle-before-assignee':
      toggleBwlAssignee(el.dataset.item, el.dataset.person);
      render();
      break;
    case 'delete-trip': case 'delete-category': case 'delete-item': case 'delete-before': case 'delete-person':
      handleDelete(action, el.dataset.id);
      break;
    case 'move-to-bwl':
      moveItemToBwl(el.dataset.cat, el.dataset.item);
      render();
      break;
    case 'sign-in': signIn(); break;
    case 'sign-out':
      stopHouseholdListeners();
      signOutUser();
      break;
    case 'join-household': joinHousehold(pendingJoinId); break;
    case 'decline-invite':
      pendingJoinId = null; UI.onboardInviteName = null; UI.onboardInviteError = '';
      render();
      break;
    case 'finish-onboarding': UI.view = 'trips'; saveUISnapshot(); render(); break;
    case 'import-legacy-data': migrateLegacyData(); break;
    case 'add-starter-template': addStarterTemplate(); render(); break;
    case 'confirm-import-legacy':
      UI.confirmingImport = true; UI.onboardInviteError = ''; render();
      break;
    case 'cancel-import-legacy':
      UI.confirmingImport = false; render();
      break;
    case 'go-household':
      UI.view = 'household'; HOUSEHOLD.membersLoaded = false; saveUISnapshot(); render();
      loadHouseholdMembers();
      break;
    case 'copy-invite':
      { const link = inviteLink();
        (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
          .then(() => { UI.inviteCopied = true; render(); setTimeout(() => { UI.inviteCopied = false; render(); }, 2000); })
          .catch(() => {}); }
      break;
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('[data-action]');
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.action;
  const fd = new FormData(form);
  if (action === 'create-trip'){
    const conditions = fd.getAll('condition');
    const people = fd.getAll('person');
    const guests = fd.getAll('guest');
    createTrip(fd.get('name') || 'New trip', conditions, people, guests);
    UI.addingTrip = false;
    render();
  } else if (action === 'add-item'){
    const who = fd.getAll('who');
    const tags = fd.getAll('tags');
    addItem(form.dataset.cat, fd.get('name') || '', who, fd.get('location'), tags);
    render();
  } else if (action === 'add-before'){
    const who = fd.getAll('who');
    addBwl(fd.get('name') || '', who);
    render();
  } else if (action === 'add-category'){
    addCategory(fd.get('name') || '');
    render();
  } else if (action === 'add-location'){
    addLocation(fd.get('name') || '');
    render();
  } else if (action === 'add-trip-before'){
    const who = fd.getAll('who');
    addTripBwl(form.dataset.trip, fd.get('name') || '', who);
    form.reset();
    render();
  } else if (action === 'add-trip-person'){
    addTripPerson(form.dataset.trip, fd.get('name') || '');
    UI.addingTripPerson = false;
    render();
  } else if (action === 'add-person'){
    addPerson(fd.get('name') || '');
    form.reset();
    render();
  } else if (action === 'create-household'){
    createHousehold(fd.get('name') || '');
  }
});

document.addEventListener('input', function(e){
  const el = e.target;
  const field = el.dataset && el.dataset.field;
  if (!field) return;
  if (field === 'item-name'){
    const cat = findCategory(el.dataset.cat);
    const item = cat && cat.items.find(i => i.id === el.dataset.item);
    if (item) item.name = el.value;
  } else if (field === 'cat-name'){
    const cat = findCategory(el.dataset.cat);
    if (cat) cat.name = el.value;
  } else if (field === 'before-name'){
    const item = STATE.master.beforeWeLeave.find(i => i.id === el.dataset.item);
    if (item) item.name = el.value;
  } else if (field === 'person-name'){
    const p = getPeople().find(p => p.id === el.dataset.person);
    if (p) p.name = el.value;
  }
  scheduleMasterSave();
});

// "Add item" / "Add reminder" forms: the who-toggle chips are plain
// label+checkbox pairs (not yet part of STATE), so just keep their own
// look in sync directly — letter visible only while checked, matching the
// same "letter shown = assigned" rule as the saved items above.
document.addEventListener('change', function(e){
  const cb = e.target;
  if (cb.matches('input[type="checkbox"][name="who"]')){
    const label = cb.closest('label.pchip');
    if (!label) return;
    label.classList.toggle('on', cb.checked);
    const style = cb.checked ? label.dataset.onStyle : label.dataset.offStyle;
    if (style !== undefined) label.style.cssText = style + 'cursor:pointer;';
    const letter = label.querySelector('.pchip-letter');
    if (letter) letter.style.visibility = cb.checked ? 'visible' : 'hidden';
    return;
  }
  if (cb.matches('input[type="checkbox"][name="tags"]')){
    const label = cb.closest('label.tag-chip');
    if (label) label.classList.toggle('on', cb.checked);
    return;
  }
  if (cb.matches('select[data-field="item-location"]')){
    setItemLocation(cb.dataset.cat, cb.dataset.item, cb.value);
  }
});

/* ---------------------------------------------------------------------
   Boot — waits for Google sign-in state, then resolves which household
   (if any) this account belongs to. The actual data listeners only start
   once a household is known — see startHouseholdListeners above. The
   master-list listener only re-renders while the Manage screen is open
   (that's the only view showing master data), and the trips listener
   only re-renders while the Trips list or a Pack screen is open, so an
   unrelated update never yanks focus out from under someone mid-edit.
--------------------------------------------------------------------- */
function boot(){
  render();
  if (typeof UI._restoreScrollY === 'number'){
    window.scrollTo(0, UI._restoreScrollY);
    delete UI._restoreScrollY;
  }

  onAuthStateChanged(auth, (user) => {
    AUTH.user = user;
    AUTH.resolved = true;
    if (user){
      resolveHousehold();
    } else {
      stopHouseholdListeners();
      STATE = { master: { categories: [], beforeWeLeave: [], people: [] }, trips: [] };
      HOUSEHOLD = { id: null, name: '', resolved: false, members: [], membersLoaded: false };
      UI.view = 'trips'; UI.currentTripId = null;
      render();
    }
  });
  // Only relevant right after a signInWithRedirect() round-trip — picks
  // up an error from that flow (onAuthStateChanged alone never sees a
  // redirect that failed, only ones that succeeded).
  getRedirectResult(auth).catch(err => {
    console.warn('Packing Pal: redirect sign-in failed', err);
    UI.authError = authErrorMessage(err);
    render();
  });

  window.addEventListener('online', () => { offlineMode = false; render(); });
  window.addEventListener('offline', () => { offlineMode = true; render(); });
  offlineMode = !navigator.onLine;
}
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && UI.view === 'manage') flushMasterSaveNow();
});
addEventListener('pagehide', () => {
  if (UI.view === 'manage') flushMasterSaveNow();
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
